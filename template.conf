# Configuration for the devcontainer template.
#
# init.sh copies this file into each project's .devcontainer/ on every run, so
# a project always carries the configuration of the template it was last
# stamped from. Scripts in .devcontainer/ read it from there.
#
# Each setting is one KEY=value line. Blank lines and lines that start with "#"
# are ignored, and so are keys that no script asks for. Scripts parse this
# file and never source it, so it cannot run code.

# The version of the shared base image, which ensure-base-image.sh tags as
# devcontainer-base:<version>. Every project on the same version shares that
# image, and a project builds it only when it is missing. Bump this whenever you
# change dot_devcontainer/Dockerfile or anything it copies, such as
# init-firewall.sh. Without a bump, projects keep using the image they already
# have. The value must be a valid Docker tag, which is at most 128 characters
# of letters, digits, ".", "_" and "-", and does not start with "." or "-".
BASE_IMAGE_VERSION=1
